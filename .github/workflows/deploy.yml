name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认只读；写 Pages 的权限只下放给 deploy 这个 job。
permissions:
  contents: read

# 同一时间只跑一个发布，避免两次推送互相覆盖产物。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 复用仓库里 .nvmrc 固定的 Node 版本（22.19.0），不另写一份。
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build = tsc -b && vite build，产物在 dist/。
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # 创建 Pages 部署记录需要写 Pages 权限。
      pages: write
      # deploy-pages 用 OIDC 换取部署令牌，需要 id-token 权限。
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
