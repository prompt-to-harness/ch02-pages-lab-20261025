name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认只读；写 Pages 的权限只下放给 deploy 这个 job。
permissions:
  contents: read

# 同一时间只跑一个发布，避免两次推送互相覆盖产物。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5 起 action 自身运行在 Node 24；v4 仍是 Node 20，已被 GitHub 弃用。
        uses: actions/checkout@v5

      - name: Setup Node
        # v5 起 action 自身运行在 Node 24；v4 仍是 Node 20，已被 GitHub 弃用。
        uses: actions/setup-node@v5
        with:
          # 这里是「项目构建用的 Node」，与上面 action 自身的运行时是两回事：
          # action 用什么运行时由 action 版本决定，工具链用哪个 Node 由这里决定。
          # 复用仓库里 .nvmrc 固定的版本（22.19.0），不另写一份。
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build = tsc -b && vite build，产物在 dist/。
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        # 必须是 v5：v3 内嵌 upload-artifact@v4、v4 内嵌 upload-artifact@v4.6.2，
        # 两者都声明 node20；v5 内嵌 upload-artifact v7.0.0，才是 node24。
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # 创建 Pages 部署记录需要写 Pages 权限。
      pages: write
      # deploy-pages 用 OIDC 换取部署令牌，需要 id-token 权限。
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.0 起 action 自身运行在 Node 24；page_url 输出保持不变。
        uses: actions/deploy-pages@v5
